<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Offense Coffee</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body { padding-bottom: 80px; }
        .container { padding: 20px; max-width: 480px; margin: 0 auto; }
        
        .lb-header {
            text-align: center; margin-bottom: 20px;
        }
        .lb-header h2 { font-size: 22px; font-weight: 800; text-transform: uppercase; color: var(--accent-red); margin-bottom: 5px; }
        .lb-header p { font-size: 12px; color: var(--text-muted); }

        /* Kotak List Leaderboard */
        .lb-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .lb-title { font-size: 14px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* Baris Item */
        .lb-item {
            display: flex; align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 10px 15px; border-radius: var(--radius-md);
            margin-bottom: 10px; border: 1px solid transparent; transition: 0.2s;
        }
        .lb-item:hover { border-color: var(--accent-red); background: rgba(255,255,255,0.05); }
        
        /* Posisi Rank */
        .lb-rank { width: 30px; font-weight: 900; font-size: 16px; color: var(--text-muted); }
        .lb-rank.top-1 { color: #ffd700; font-size: 18px; } /* Emas */
        .lb-rank.top-2 { color: #c0c0c0; font-size: 17px; } /* Perak */
        .lb-rank.top-3 { color: #cd7f32; font-size: 17px; } /* Perunggu */

        /* Avatar Inisial */
        .lb-avatar {
            width: 36px; height: 36px; background: var(--bg-color); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700; color: var(--accent-red);
            margin-right: 15px; border: 1px solid var(--border-color);
        }

        /* Nama & Skor */
        .lb-name { flex: 1; font-weight: 600; font-size: 14px; }
        .lb-score { font-weight: 800; font-size: 13px; color: var(--accent-red); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { text-align: center; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: var(--accent-red); font-weight: bold; }
        .nav-item span { display: block; font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Offense <span>Coffee</span></div>
        <button class="btn btn-secondary" onclick="logout()" style="width:auto; padding: 8px 12px; font-size:12px;">Logout</button>
    </nav>

    <div class="container">
        <div class="lb-header">
            <h2>🏆 Hall of Fame</h2>
            <p>Papan peringkat pelanggan setia Offense</p>
        </div>
        
        <!-- Top Spender -->
        <div class="lb-box">
            <div class="lb-title"><span>💰</span> Paling Royal (Bulan Ini)</div>
            <div id="spenderList"></div>
        </div>

        <!-- Sering Ngopi -->
        <div class="lb-box">
            <div class="lb-title"><span>☕</span> Paling Sering Ngopi</div>
            <div id="visitorList"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span>🏠</span>Beranda</a>
        <a href="leaderboard.html" class="nav-item active"><span>🏆</span>Leaderboard</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config/supabase.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/pages/customer/leaderboard.page.js"></script>
    <script src="../js/core/ui.js"></script>
</body>
</html>
