<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pesanan - Offense Coffee</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body { padding-bottom: 80px; }
        .container { padding: 20px; max-width: 480px; margin: 0 auto; }

        .history-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            display: flex;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .history-icon {
            width: 80px;
            background: var(--accent-red);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            color: white;
        }
        /* Warna icon beda-beda biar keren */
        .history-card:nth-child(2n) .history-icon { background: #ff9800; }
        .history-card:nth-child(3n) .history-icon { background: #2196f3; }

        .history-detail {
            padding: 15px;
            flex: 1;
            display: flex; flex-direction: column; justify-content: center;
        }
        .history-detail h4 { font-size: 16px; margin-bottom: 4px; }
        .history-detail p { font-size: 12px; color: var(--text-muted); margin: 0; }
        
        .history-price {
            margin-top: 8px;
            font-weight: 800;
            color: var(--accent-red);
            font-size: 14px;
        }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { text-align: center; color: var(--text-muted); font-size: 11px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: var(--accent-red); font-weight: bold; }
        .nav-item span { display: block; font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Offense <span>Coffee</span></div>
        <button class="btn btn-secondary" onclick="logout()" style="width:auto; padding: 8px 12px; font-size:12px;">Logout</button>
    </nav>

    <div class="container">
        <h2 style="margin-bottom: 20px;">Riwayat Pesanan</h2>
        <div id="orderList">
            <p class="font-muted">Memuat pesanan...</p>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span>🏠</span>Beranda</a>
        <a href="voucher.html" class="nav-item"><span>🎟️</span>Voucher</a>
        <a href="riwayat.html" class="nav-item active"><span>🧾</span>Riwayat</a>
        <a href="leaderboard.html" class="nav-item"><span>🏆</span>Peringkat</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config/supabase.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/pages/customer/riwayat.page.js"></script>
    <script src="../js/core/ui.js"></script>
</body>
</html>
