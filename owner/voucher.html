    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body { padding-bottom: 80px; }
        .container { padding: 20px; max-width: 480px; margin: 0 auto; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }

<body>

            <button class="btn btn-primary btn-block" onclick="redeemVoucher()">Klaim Voucher</button>
