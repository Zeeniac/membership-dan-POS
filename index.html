<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Daftar - Offense Coffee</title>
    <link rel="icon" type="image/png" href="assets/images/logo-circle.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-container { width: 100%; max-width: 400px; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-muted); font-weight: 600; }
        .auth-tab.active { border-bottom-color: var(--accent-red); color: var(--text-main); }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="card card-brand">
            <h1 class="text-center" style="margin-bottom: 5px;">Offense <span class="text-red">Coffee</span></h1>
            <p class="text-center font-muted" style="margin-bottom: 20px; text-transform: uppercase; font-size: 12px;">Membership System</p>

            <!-- Tab Navigasi -->
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Login</div>
                <div class="auth-tab" onclick="switchTab('register')">Daftar</div>
            </div>

            <!-- Form Login -->
            <form id="formLogin" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="loginUsername" class="form-control" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Masuk</button>
                <p class="text-center font-muted" style="margin-top: 15px; font-size: 12px; cursor: pointer;" onclick="showPopup('Lupa Password?', 'Silakan hubungi Owner untuk reset password.', 'info')">Lupa Password?</p>
            </form>

            <!-- Form Register -->
            <form id="formRegister" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="regUsername" class="form-control" placeholder="Username unik (tanpa spasi)" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" id="regName" class="form-control" placeholder="Nama kamu" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="email@contoh.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Buat password" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">Ulangi Password</label>
                    <input type="password" id="regConfirmPassword" class="form-control" placeholder="Ketik ulang password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="btnRegister">Daftar Sekarang</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config/supabase.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/ui.js"></script>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelector('.auth-tab:nth-child(1)').classList.add('active');
                document.getElementById('formLogin').classList.add('active');
            } else {
                document.querySelector('.auth-tab:nth-child(2)').classList.add('active');
                document.getElementById('formRegister').classList.add('active');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.textContent = 'Loading...'; btn.disabled = true;
            try {
                await login(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value);
            } catch (error) {
                showPopup('Login Gagal', error.message, 'error');
                btn.textContent = 'Masuk'; btn.disabled = false;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnRegister');
            
            const username = document.getElementById('regUsername').value.trim();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;
            const confirmPass = document.getElementById('regConfirmPassword').value;

            if (pass !== confirmPass) {
                return showPopup('Gagal', 'Password dan Ulangi Password tidak cocok!', 'error');
            }

            btn.textContent = 'Loading...'; btn.disabled = true;
            try {
                await register(username, name, email, pass);
                showPopup('Berhasil!', 'Pendaftaran berhasil! Silakan Login.', 'success');
                switchTab('login');
            } catch (error) {
                showPopup('Daftar Gagal', error.message, 'error');
            } finally {
                btn.textContent = 'Daftar Sekarang'; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
